# Manually create and publish a GitHub pre-release from the selected branch and tag.
name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example: v0.2.3 or v0.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-manual-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: release (${{ inputs.tag }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: prepare
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          echo "version=${INPUT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub CLI
        run: gh --version

      - name: Create published GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$INPUT_TAG" \
            --target "$RELEASE_BRANCH" \
            --title "safariyyds $INPUT_TAG" \
            --generate-notes \
            --prerelease

  npm:
    name: npm (${{ needs.release.outputs.version }})
    needs: release
    uses: ./.github/workflows/publish-npm.yml
    with:
      is_prerelease: true
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      id-token: write
