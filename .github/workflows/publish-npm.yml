# Publish the package to npm.
name: Publish npm

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag or package version to publish"
        required: true
        type: string
      is_prerelease:
        description: "Publish with the next npm dist-tag"
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ inputs.version }})
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      IS_PRERELEASE: ${{ inputs.is_prerelease }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare npm publish metadata
        id: metadata
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          IS_PRERELEASE: ${{ env.IS_PRERELEASE }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          release_version="${RELEASE_VERSION#v}"

          if [ -z "$release_version" ]; then
            echo "Release version is empty"
            exit 1
          fi

          if [ "$release_version" != "$package_version" ]; then
            echo "Release version ($release_version) does not match package.json version ($package_version)"
            exit 1
          fi

          npm_tag="latest"
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm_tag="next"
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - name: Build and pack
        run: bun run release:check

      - name: Publish to npm
        env:
          NPM_TAG: ${{ steps.metadata.outputs.npm_tag }}
        run: npm publish --access public --tag "$NPM_TAG" --provenance
