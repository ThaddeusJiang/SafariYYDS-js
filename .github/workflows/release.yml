# Publish npm package when a GitHub release is published.
name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch npm publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REF: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "Release tag is empty"
            exit 1
          fi

          gh workflow run publish-npm.yml \
            --ref "$RELEASE_REF" \
            -f version="$RELEASE_TAG" \
            -f is_prerelease="$IS_PRERELEASE"
